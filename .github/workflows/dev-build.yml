name: Building Development
description: Building the code of branch 'dev' on pushing, and push the result into the branch 'dev-build'.

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.JS
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installing Dependencies
        run: npm ci
      - name: Building the project
        run: npm run build
      - name: Checkout 'dev-build' branch
        uses: actions/checkout@v4
        with:
          ref: dev-build
          path: target-branch
      - name: Copy the build files to 'dev-build' branch
        run: |
          rm -rf target-branch/*
          cp -r dist/* target-branch/
      - name: Commit and push on 'dev-build' branch
        run: |
          cd target-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build from dev @ $GITHUB_SHA" || echo "No changes to commit"
          git push origin dev-build
